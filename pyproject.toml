[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "githarness"
version = "0.1.0"
description = "Git-style version tracking for agent harnesses under evolving user requirements"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anonymous Authors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14,<0.15"]
yaml = ["PyYAML>=6"]
stackplanner = [
  "dataclasses-json>=0.6.7",
  "httpx>=0.28.1",
  "Jinja2>=3.1",
  "json-repair>=0.7.0",
  "langchain-community>=0.3.19",
  "langchain-deepseek>=0.1.0,<0.1.2",
  "langchain-experimental>=0.3.4",
  "langchain-openai>=0.3.8",
  "langgraph>=0.3.5",
  "loguru>=0.7.3",
  "markdownify>=1.1.0",
  "PyYAML>=6",
  "python-dotenv>=1.0.1",
  "readabilipy>=0.3.0",
  "socksio>=1.0.0",
  "tavily-python>=0.5.0",
]
swe = ["swebench==4.0.5"]

[project.scripts]
githarness = "githarness.cli:main"
mtagentbench = "mtagentbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/githarness", "src/mtagentbench"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/stackplanner" = "githarness/_vendor/stackplanner"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["githarness", "mtagentbench"]
